<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#111b3b">
<title>PIXEL QUEST — HTML Platformer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111b3b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none;user-select:none}#game{width:100%;height:100%;display:block;image-rendering:pixelated}#hud{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.badge{background:#111a37dc;border:2px solid #ffffff2c;border-radius:10px;padding:7px 10px;font-size:11px;font-weight:900;text-shadow:1px 2px #000;box-shadow:0 3px #0003}.badge strong{color:#ffe66d;font-size:15px;margin-left:4px}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:#07102865}#panel{width:min(430px,100%);max-height:90dvh;overflow:auto;border:3px solid #fff;border-radius:18px;background:linear-gradient(#284b8d,#17234f);padding:22px;box-shadow:0 8px 0 #080d25,0 20px 60px #0007;text-align:center}h1{font-size:clamp(36px,10vw,56px);line-height:.9;margin:6px 0 12px;letter-spacing:-2px;text-shadow:3px 4px #10172f;color:#ffe66d}p{color:#dce8ff;font-size:13px;line-height:1.5}.btn{border:0;border-radius:10px;background:#ffe66d;color:#18234b;padding:13px 16px;font-weight:1000;font-size:14px;box-shadow:0 4px 0 #b9862a;width:100%;margin-top:8px}.btn.alt{background:#6ef7e8;box-shadow:0 4px 0 #248b93}.row{display:flex;gap:10px}.row .btn{flex:1}.small{font-size:10px;color:#a9c4ff}.hidden{display:none!important}#controls{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 12px);display:flex;justify-content:space-between;align-items:flex-end;padding:0 15px;pointer-events:none}#move,#action{display:flex;gap:10px;pointer-events:auto}.pad{width:61px;height:61px;border-radius:17px;background:#15244cbb;border:2px solid #ffffff66;box-shadow:0 5px 0 #060b1f77;color:white;font-size:25px;font-weight:1000;display:grid;place-items:center;touch-action:none}.pad.big{width:72px;height:72px;border-radius:50%;background:#ffdf65e8;color:#152047;border-color:#fff5b8;font-size:12px;box-shadow:0 5px 0 #a7772d}.pad:active{transform:translateY(3px);box-shadow:0 2px 0 #060b1f77}#hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 91px);left:50%;transform:translateX(-50%);font-size:10px;color:#ffffffd9;text-shadow:1px 2px #000;white-space:nowrap;pointer-events:none}#pause{position:absolute;top:calc(env(safe-area-inset-top) + 56px);right:10px;width:36px;height:36px;border-radius:10px;border:1px solid #ffffff55;background:#111a37c9;color:white;font-weight:900} @media(min-width:800px){#controls{max-width:900px;margin:auto;left:0;right:0}.pad{width:68px;height:68px}}
</style></head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="badge">WORLD <strong id="world">1-1</strong></div><div class="badge">COINS <strong id="coins">0</strong></div><div class="badge">LIVES <strong id="lives">3</strong></div><div class="badge">SCORE <strong id="score">000000</strong></div></div>
<button id="pause">Ⅱ</button>
<div id="hint">◀ ▶ ДВИЖЕНИЕ · A ПРЫЖОК · B РЫВОК</div>
<div id="controls"><div id="move"><button class="pad" id="left">◀</button><button class="pad" id="right">▶</button></div><div id="action"><button class="pad big" id="dash">B<br>РЫВОК</button><button class="pad big" id="jump">A<br>ПРЫЖОК</button></div></div>
<div id="overlay"><div id="panel"><div class="small">8-BIT ADVENTURE</div><h1>PIXEL<br>QUEST</h1><p>Собирай монеты, прыгай по платформам, разбивай бонусные блоки и доберись до финиша. Твой пиксельный герой ждёт приключений.</p><div class="row"><button class="btn" id="start">ИГРАТЬ</button><button class="btn alt" id="how">КАК ИГРАТЬ</button></div><p class="small">Оригинальный ретро-платформер · работает на телефоне</p></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');
let W=0,H=0,dpr=1,cam=0,last=0,state='menu',level=0,score=0,coinsTotal=0,lives=3,levelCoins=0,player,platforms=[],items=[],enemies=[],blocks=[],particles=[],keys={},touch={},goal=0,worldWidth=3400,levelTime=0,checkpoint=0,invuln=0;
const tile=40;
const worlds=[
 {name:'GREEN HILLS',sky:['#76d8ff','#d8f8ff'],ground:'#4cba57',dark:'#268044',accent:'#ffdb62'},
 {name:'DUSK CANYON',sky:['#ffb16b','#ffdfac'],ground:'#bd7446',dark:'#7f493e',accent:'#fff078'},
 {name:'MOON FORT',sky:['#26376e','#8a6fd4'],ground:'#6775b9',dark:'#374780',accent:'#74f5f0'}
];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
window.addEventListener('resize',resize);resize();
function rnd(a,b){return a+Math.random()*(b-a)}
function setupLevel(n,keep=true){level=n;cam=0;levelTime=0;levelCoins=0;worldWidth=3200+n*260;goal=worldWidth-140;platforms=[];items=[];enemies=[];blocks=[];particles=[];
let ground=H*.77;platforms.push({x:0,y:ground,w:600,h:100,type:'ground'});let x=600;
while(x<worldWidth-280){let gap=rnd(35,90),w=rnd(170,310),y=ground-rnd(0,Math.min(145,H*.22));x+=gap;platforms.push({x,y,w,h:100,type:'ground'});if(Math.random()<.6){let bx=x+rnd(45,Math.max(50,w-60));blocks.push({x:bx,y:y-95,w:40,h:40,type:Math.random()<.3?'bonus':'brick',used:false});if(Math.random()<.75)items.push({x:bx+20,y:y-135,type:'coin',got:false});}
if(Math.random()<.72){let ex=x+rnd(60,Math.max(65,w-30));enemies.push({x:ex,y:y-30,w:30,h:30,vx:Math.random()<.5?-42:42,alive:true,min:x,max:x+w-30})}
if(Math.random()<.8){let count=3+Math.floor(Math.random()*4),cx=x+rnd(25,Math.max(30,w-count*28));for(let i=0;i<count;i++)items.push({x:cx+i*28,y:y-rnd(50,85),type:'coin',got:false})}
x+=w;ground=y;}
platforms.push({x:worldWidth-270,y:ground,w:330,h:100,type:'ground'});platforms.push({x:worldWidth-210,y:ground-120,w:70,h:18,type:'ledge'});items.push({x:worldWidth-180,y:ground-160,type:'star',got:false});player={x:70,y:H*.45,w:27,h:36,vx:0,vy:0,ground:false,face:1,run:0,dead:false};checkpoint=70;invuln=1;updateHud();state='playing'}
function updateHud(){$('world').textContent=(level+1)+'-1';$('coins').textContent=coinsTotal;$('lives').textContent=lives;$('score').textContent=String(score).padStart(6,'0')}
function overlay(title,body,buttons){$('panel').innerHTML=`<div class="small">8-BIT ADVENTURE</div><h1>${title}</h1><p>${body}</p>${buttons}<p class="small">PIXEL QUEST · прогресс сохраняется в этой сессии</p>`;$('overlay').classList.remove('hidden')}
function hideOverlay(){$('overlay').classList.add('hidden')}
function startGame(){score=0;coinsTotal=0;lives=3;setupLevel(0);hideOverlay()}
function pauseGame(){if(state==='playing'){state='paused';overlay('ПАУЗА','Передохни. Платформы никуда не денутся.',`<button class="btn" id="resume">ПРОДОЛЖИТЬ</button><button class="btn alt" id="restart">ЗАНОВО</button>`);$('resume').onclick=()=>{state='playing';hideOverlay()};$('restart').onclick=startGame}else if(state==='paused'){state='playing';hideOverlay()}}
function finishLevel(){state='clear';score+=1000+levelCoins*50;updateHud();overlay('УРОВЕНЬ<br>ПРОЙДЕН!','Финиш найден. Монеты при тебе, гордость восстановлена.',`<button class="btn" id="next">СЛЕДУЮЩИЙ МИР ↗</button><button class="btn alt" id="again">ПОВТОРИТЬ</button>`);$('next').onclick=()=>{if(level>=2){overlay('ПОБЕДА!','Ты прошёл все три мира. Легендарная работа большого пальца.',`<button class="btn" id="againAll">ЕЩЁ РАЗ</button>`);$('againAll').onclick=startGame}else{setupLevel(level+1);hideOverlay()}};$('again').onclick=()=>{setupLevel(level);hideOverlay()}}
function loseLife(){if(invuln>0||state!=='playing')return;lives--;updateHud();if(lives<=0){state='over';overlay('ИГРА<br>ОКОНЧЕНА','Даже герои иногда летят вниз. Попробуем ещё раз?',`<button class="btn" id="retry">ПОВТОРИТЬ ЗАБЕГ</button>`);$('retry').onclick=startGame}else{player.x=Math.max(checkpoint,cam+30);player.y=H*.25;player.vx=0;player.vy=0;invuln=1.5}}
function jump(){if(state!=='playing')return;if(player.ground){player.vy=-610;player.ground=false;burst(player.x+14,player.y+35,'#fff',5)}}
function dash(){if(state!=='playing')return;player.vx=player.face*430;player.vy=Math.min(player.vy,40);burst(player.x+14,player.y+18,'#6ef7e8',8)}
function burst(x,y,color,n){for(let i=0;i<n;i++)particles.push({x,y,vx:rnd(-100,100),vy:rnd(-130,20),life:rnd(.2,.5),color})}
function drawSky(){let w=worlds[level%worlds.length],g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,w.sky[0]);g.addColorStop(1,w.sky[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.fillStyle='#ffffff88';for(let i=0;i<4;i++){let x=((i*270-cam*.16)%(W+200)+W+200)%(W+200)-100,y=70+(i%3)*60;ctx.beginPath();ctx.ellipse(x,y,32,12,0,0,Math.PI*2);ctx.ellipse(x+22,y+3,22,10,0,0,Math.PI*2);ctx.ellipse(x-20,y+4,19,8,0,0,Math.PI*2);ctx.fill()}
ctx.fillStyle=w.dark;for(let i=0;i<Math.ceil(W/80)+2;i++){let x=i*80-(cam*.28%80),bh=60+((i*37)%100);ctx.fillRect(x,H*.69-bh,62,bh);ctx.fillStyle='#ffffff24';for(let wy=H*.69-bh+12;wy<H*.69-8;wy+=17)for(let wx=x+9;wx<x+55;wx+=15)ctx.fillRect(wx,wy,6,7);ctx.fillStyle=w.dark}}
function drawPlatform(p){let x=p.x-cam;if(x+p.w<0||x>W)return;let w=worlds[level%worlds.length];if(p.type==='ground'){ctx.fillStyle=w.ground;ctx.fillRect(x,p.y,p.w,p.h);ctx.fillStyle='#b4f06b';ctx.fillRect(x,p.y,p.w,8);ctx.fillStyle=w.dark;for(let bx=x+5;bx<x+p.w;bx+=28){ctx.fillRect(bx,p.y+18,18,5);ctx.fillRect(bx+7,p.y+38,14,5)}ctx.fillStyle='#00000014';ctx.fillRect(x,p.y+70,p.w,30)}else{ctx.fillStyle='#b77b55';ctx.fillRect(x,p.y,p.w,p.h);ctx.fillStyle='#ffdc75';ctx.fillRect(x,p.y,p.w,6);ctx.strokeStyle='#67423b';ctx.lineWidth=2;ctx.strokeRect(x,p.y,p.w,p.h)}}
function drawBlock(b){let x=b.x-cam;if(x<-50||x>W+50)return;ctx.fillStyle=b.used?'#82745c':(b.type==='bonus'?'#ffd85e':'#c47b4e');ctx.fillRect(x,b.y,b.w,b.h);ctx.fillStyle='#fff1a4';ctx.fillRect(x+3,b.y+3,b.w-6,5);ctx.strokeStyle='#714b3c';ctx.lineWidth=3;ctx.strokeRect(x+1,b.y+1,b.w-2,b.h-2);if(!b.used){ctx.fillStyle='#5c3a2d';ctx.font='bold 24px monospace';ctx.textAlign='center';ctx.fillText(b.type==='bonus'?'?':'▦',x+b.w/2,b.y+29)}}
function drawItem(it){if(it.got)return;let x=it.x-cam;if(x<-30||x>W+30)return;ctx.save();ctx.translate(x,it.y);if(it.type==='coin'){ctx.fillStyle='#ffbf36';ctx.beginPath();ctx.ellipse(0,0,8,12,Math.sin(performance.now()/180)*.3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff4a1';ctx.fillRect(-2,-7,3,12)}else{ctx.fillStyle='#ff6fe3';ctx.shadowBlur=18;ctx.shadowColor='#ff6fe3';ctx.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,r=i%2?7:15;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill()}ctx.restore()}
function drawEnemy(e){if(!e.alive)return;let x=e.x-cam;ctx.fillStyle='#763c79';ctx.fillRect(x,e.y+7,e.w,e.h-7);ctx.fillStyle='#b56bc1';ctx.fillRect(x+3,e.y,e.w-6,17);ctx.fillStyle='#fff';ctx.fillRect(x+5,e.y+7,6,6);ctx.fillRect(x+18,e.y+7,6,6);ctx.fillStyle='#222';ctx.fillRect(x+7,e.y+9,3,4);ctx.fillRect(x+20,e.y+9,3,4);ctx.fillStyle='#3d214d';ctx.fillRect(x+3,e.y+e.h-4,8,5);ctx.fillRect(x+19,e.y+e.h-4,8,5)}
function drawPlayer(){let x=player.x-cam,y=player.y;ctx.save();if(invuln>0&&Math.floor(performance.now()/90)%2)ctx.globalAlpha=.45;let step=player.ground?Math.sin(player.run*13)*3:0;ctx.fillStyle='#21305b';ctx.fillRect(x+4,y+7,20,27);ctx.fillStyle='#f1b184';ctx.fillRect(x+6,y,17,15);ctx.fillStyle='#3b2c4d';ctx.fillRect(x+4,y-3,20,7);ctx.fillRect(x+2,y+3,6,5);ctx.fillStyle='#fff';ctx.fillRect(x+17,y+5,4,4);ctx.fillStyle='#273254';ctx.fillRect(x+11,y+10,11,3);ctx.fillStyle='#e8484e';ctx.fillRect(x+3,y+16,22,11);ctx.fillStyle='#f9d86b';ctx.fillRect(x+11,y+17,5,8);ctx.fillStyle='#e7edf9';ctx.fillRect(x+4,y+27,8,7);ctx.fillRect(x+17,y+27,8,7);ctx.fillStyle='#553e56';ctx.fillRect(x+2,y+32+Math.max(0,step),11,5);ctx.fillRect(x+16,y+32-Math.max(0,step),12,5);ctx.restore()}
function drawFlag(){let x=goal-cam;if(x<-20||x>W+20)return;let p=platforms.find(p=>goal>=p.x&&goal<=p.x+p.w)||platforms[platforms.length-1];ctx.fillStyle='#f5f1d0';ctx.fillRect(x,p.y-120,5,120);ctx.fillStyle='#ff4c66';ctx.beginPath();ctx.moveTo(x+5,p.y-116);ctx.lineTo(x+46,p.y-102);ctx.lineTo(x+5,p.y-88);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(x+12,p.y-108,9,3)}
function draw(){ctx.clearRect(0,0,W,H);drawSky();platforms.forEach(drawPlatform);blocks.forEach(drawBlock);items.forEach(drawItem);enemies.forEach(drawEnemy);drawFlag();particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/.5);ctx.fillStyle=p.color;ctx.fillRect(p.x-cam,p.y,4,4)});ctx.globalAlpha=1;if(player)drawPlayer()}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function update(dt){if(state!=='playing'){particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);return}
levelTime+=dt;invuln=Math.max(0,invuln-dt);player.run+=dt;let dir=(keys.right||touch.right?1:0)-(keys.left||touch.left?1:0);if(dir){player.vx+=dir*1700*dt;player.face=dir}else player.vx*=Math.pow(.0007,dt);player.vx=Math.max(-260,Math.min(260,player.vx));player.vy+=1550*dt;player.x+=player.vx*dt;player.y+=player.vy*dt;player.ground=false;
for(let p of platforms){if(player.vx>0&&player.x+player.w>p.x&&player.x<p.x+12&&player.y+player.h>p.y+8&&player.y<p.y+p.h)player.x=p.x-player.w;if(player.vx<0&&player.x<p.x+p.w&&player.x+player.w>p.x+p.w-12&&player.y+player.h>p.y+8&&player.y<p.y+p.h)player.x=p.x+p.w;if(player.x+player.w>p.x&&player.x<p.x+p.w&&player.y+player.h>=p.y&&player.y+player.h<=p.y+25&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.ground=true;checkpoint=Math.max(checkpoint,player.x-30)}}
for(let b of blocks){if(!b.used&&overlap(player,b)){if(player.vy<0&&player.y<b.y+b.h&&player.y> b.y-16){b.used=true;player.vy=120;if(b.type==='bonus'){items.push({x:b.x+20,y:b.y-30,type:'coin',got:false});score+=100;burst(b.x+20,b.y,'#ffe66d',8)}else{score+=25;burst(b.x+20,b.y,'#dba17c',5)}}}}
for(let e of enemies){if(!e.alive)continue;e.x+=e.vx*dt;if(e.x<e.min||e.x>e.max)e.vx*=-1;if(overlap(player,e)){if(player.vy>80&&player.y+player.h-e.y<18){e.alive=false;player.vy=-390;score+=200;burst(e.x+15,e.y,'#ff87e7',8)}else if(invuln<=0){loseLife();break}}}
for(let it of items){if(it.got)continue;let box={x:it.x-9,y:it.y-13,w:18,h:26};if(overlap(player,box)){it.got=true;if(it.type==='coin'){coinsTotal++;levelCoins++;score+=100;burst(it.x,it.y,'#ffe66d',4)}else{lives=Math.min(5,lives+1);score+=500;burst(it.x,it.y,'#ff6fe3',12)}updateHud()}}
particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);cam=Math.max(0,Math.min(worldWidth-W,player.x-W*.32));if(player.y>H+120){loseLife()}if(player.x>goal)finishLevel();updateHud()}
let lastFrame=0;function loop(t){let dt=Math.min(.032,(t-lastFrame)/1000||0);lastFrame=t;update(dt);draw();requestAnimationFrame(loop)}
function bindHold(id,key){let el=$(id);let down=e=>{e.preventDefault();touch[key]=true};let up=e=>{e.preventDefault();touch[key]=false};el.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,up))}
bindHold('left','left');bindHold('right','right');$('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});$('dash').addEventListener('pointerdown',e=>{e.preventDefault();dash()});
$('start').onclick=startGame;$('how').onclick=()=>overlay('КАК<br>ИГРАТЬ','◀ ▶ — двигаться. A — прыгнуть. B — сделать рывок. Приземляйся на врагов сверху, собирай монеты, бей головой по блокам с вопросом и доберись до флага. Не падай в пропасти.',`<button class="btn" id="gotit">ПОНЯТНО</button>`);document.addEventListener('click',e=>{if(e.target&&e.target.id==='gotit'){$('overlay').classList.remove('hidden');$('panel').innerHTML='<div class="small">8-BIT ADVENTURE</div><h1>PIXEL<br>QUEST</h1><p>Собирай монеты, прыгай по платформам, разбивай бонусные блоки и доберись до финиша.</p><div class="row"><button class="btn" id="start2">ИГРАТЬ</button><button class="btn alt" id="how2">КАК ИГРАТЬ</button></div>';$('start2').onclick=startGame;$('how2').onclick=()=>overlay('КАК<br>ИГРАТЬ','◀ ▶ — двигаться. A — прыгнуть. B — рывок. Приземляйся на врагов сверху и доберись до флага.',`<button class="btn" id="gotit">ПОНЯТНО</button>`)}});$('pause').onclick=pauseGame;
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space','ArrowUp','KeyA','KeyD','KeyW','ShiftLeft','KeyJ','KeyK'].includes(e.code))e.preventDefault();if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true;if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')jump();if(e.code==='ShiftLeft'||e.code==='KeyJ'||e.code==='KeyK')dash();if(e.code==='Escape')pauseGame()});document.addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pauseGame()});
setupLevel(0);state='menu';overlay('PIXEL<br>QUEST','Собирай монеты, прыгай по платформам, разбивай блоки и проходи три мира.',`<div class="row"><button class="btn" id="start2">ИГРАТЬ</button><button class="btn alt" id="how2">КАК ИГРАТЬ</button></div>`);$('start2').onclick=startGame;$('how2').onclick=()=>overlay('КАК<br>ИГРАТЬ','◀ ▶ — движение. A — прыжок. B — рывок. Врагов можно победить прыжком сверху. Собирай монеты и доберись до флага.',`<button class="btn" id="gotit2">ПОНЯТНО</button>`);document.addEventListener('click',e=>{if(e.target&&e.target.id==='gotit2')overlay('PIXEL<br>QUEST','Собирай монеты, прыгай по платформам, разбивай блоки и проходи три мира.',`<button class="btn" id="start3">ИГРАТЬ</button>`);if(e.target&&e.target.id==='start3')startGame()});requestAnimationFrame(loop);
})();
</script></body></html>
